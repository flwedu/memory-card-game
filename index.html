<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Game 🃏</title>
</head>

<body>
  <div class="gradient-border">
    <div id="app">
      <div id="game-settings">
        <h1>Memory Card Game</h1>
        <p class="subtitle">Test your memory!</p>
        <div id="best-scores"></div>
        <form name="settings" action="#" class="flex flex-center flex-col" method="POST">
          <label for="size">Number of pairs</label>
          <select name="size" id="size">
            <option value="4">4 pairs — Easy</option>
            <option value="6">6 pairs — Medium</option>
            <option value="8">8 pairs — Hard</option>
            <option value="10">10 pairs — Expert</option>
          </select>
          <button type="submit" name="submit" id="submit">Start Game</button>
        </form>
      </div>

      <div id="game-hud" style="display:none">
        <div id="timer">⏱ <span id="timer-value">00:00</span></div>
        <div id="wrong-moves">❌ <span id="wrong-moves-value">0</span></div>
        <div id="total-moves">🎯 <span id="total-moves-value">0</span></div>
      </div>

      <div id="progress-bar-container" style="display:none">
        <div id="progress-bar"></div>
      </div>

      <div id="card-list" class="card-list" style="display:none"></div>
    </div>
  </div>
  <script type="module" src="/src/index.ts"></script>
</body>

</html>
